name: Syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m py_compile tts_server.py voice_library_server.py live_tts.py live_web.py noi.py tao_truyen.py
